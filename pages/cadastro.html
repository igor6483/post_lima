<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de atletas</title>
    <link rel="stylesheet" href="../css/formulario.css" />
    <script src="../js/post.js" defer></script>
  </head>
  <body>
    <header>
      <h1><u>Cadastro de atletas</u></h1>
      <p>Preencha os dados abaixo!!!</p>
    </header>
    <main>
      <section id="corpo">
        <p><a href="../index.html">Consultar atletas</a></p>
        <h2>Novo atleta</h2>

        <form id="form-atleta">
          <section class="infos">
          <label for="title">Nome do atleta: </label>
          <input id="title" name="title" type="text" minlength="3" maxlength="120" required />
          </section>  

          <section class="infos">
          <label for="esporte">Esporte: </label>
          <input id="esporte" name="esporte" type="text" required />
          </section>

          <section class="infos">
          <label for="pais">País: </label>
          <input id="pais" name="pais" type="text" required />
          </section>

          <section class="infos">
          <label for="idade">Idade: </label>
          <input id="idade" name="idade" type="text" required />
          </section>
          
          <section class="infos">
          <label for="conquistas">Conquistas: </label>
          <input id="conquistas" name="conquistas" type="text" required />
          </section>

          <section class="infos">
          <label for="imageUrl">URL da imagem (opcional): </label>
          <input id="imageUrl" name="imageUrl" type="url" />
          </section>

          <section class="infos">
          <button type="submit">Cadastrar atleta</button>
          </section>
        </form>

        <p id="resposta"></p>
      </section>
    </main>
  </body>
</html>
